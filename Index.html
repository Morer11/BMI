<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2d6bc4">
<title>BMI Calculator</title>
<style>
:root{--ink:#0f1f3d;--muted:#5d6b82;--line:#d9e3f0;--blue:#1f7ae8;--blue-d:#0b6cdb;--soft:#f0f6fe;--field:#eef2f8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--ink);font-family:Roboto,"Segoe UI",system-ui,Arial,sans-serif;line-height:1.25}
html,body{max-width:100%;overflow-x:hidden}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
/* every size below is relative to the screen width (cqw) so the layout keeps the screenshot's proportions */
.wrap{container-type:inline-size;width:100%;max-width:412px;min-height:100vh;margin:0 auto;padding:3cqw;display:grid;grid-template-columns:minmax(0,1fr);gap:3cqw;align-content:start}

.hero{background:linear-gradient(135deg,#2f6fc9,#2a62b8);color:#fff;border-radius:4.2cqw;padding:5cqw 5cqw 5cqw 6cqw;display:flex;align-items:center;gap:4cqw;min-height:25cqw}
.hero>div{min-width:0}
.hero svg{flex:none;width:21cqw;height:auto}
.hero h1{margin:0 0 1.8cqw;font-size:max(21px,6.1cqw);line-height:1.05;font-weight:800;white-space:nowrap}
.hero h1 span{color:#aedaff}
.hero p{margin:0;font-size:max(12px,3.45cqw);line-height:1.3;opacity:.93}

.card{background:#fff;border:1px solid #e6edf6;border-radius:3.6cqw;padding:3.8cqw;box-shadow:0 1px 8px rgba(20,50,100,.05)}
h2{margin:0 0 3cqw;font-size:max(18px,4.9cqw);font-weight:800}

.tabs{display:grid;grid-template-columns:1fr 1fr;width:100%;border:1px solid var(--line);border-radius:1.5cqw;background:var(--field);margin-bottom:4.5cqw}
.tab{border:0;background:transparent;color:var(--ink);font:inherit;font-size:max(12.5px,3.4cqw);min-height:max(42px,7cqw);padding:0 1cqw;cursor:pointer;border-radius:1.5cqw}
.tab[aria-selected="true"]{background:var(--blue-d);color:#fff;font-weight:600}

.field{display:grid;grid-template-columns:max(34px,10.5cqw) 1fr;margin-bottom:3.6cqw;align-items:start}
.btn svg{width:max(22px,4.4cqw);height:auto}

.result{display:grid;grid-template-columns:44% 1fr}
.score{background:var(--soft);border-radius:3.2cqw;padding:4.5cqw 1cqw;text-align:center}
.score b{display:block;font-size:max(44px,12cqw);line-height:1;font-weight:800}
.score span{display:block;font-size:max(15px,3.8cqw);margin-top:1cqw}
.status{display:flex;align-items:center;gap:3cqw;margin-left:4cqw;padding-left:4cqw;border-left:1px solid var(--line)}
.heart{flex:none;width:max(48px,13cqw);aspect-ratio:1;border-radius:50%;background:#e4f5ee;display:grid;place-items:center}
.heart svg{width:52%}
.status small{display:block;font-size:max(13px,3.3cqw);font-weight:500}
.status strong{display:block;font-size:max(15px,3.8cqw);line-height:1.2;margin-top:1cqw}
#msg{margin:3cqw 0 0;color:var(--muted);font-size:max(12.5px,3.2cqw);min-height:4cqw}

.guide{background:var(--soft);border-radius:3.2cqw;padding:3.6cqw 2.4cqw 3cqw;margin-top:3cqw}
.guide h3{margin:0 0 3cqw 1.2cqw;font-size:max(15px,3.9cqw);font-weight:800}
.bands{display:grid;grid-template-columns:repeat(5,1fr)}
.band{text-align:center;padding:0 .6cqw;border-left:1px solid var(--line);transition:opacity .2s}
.band:first-child{border-left:0}
.band i{display:block;height:max(10px,2.9cqw);border-radius:1cqw;margin:0 .8cqw 3cqw}
.band b{display:flex;align-items:center;justify-content:center;min-height:2.4em;font-size:max(10px,2.55cqw);line-height:1.15}
.band span{display:block;font-size:max(10px,2.55cqw);color:var(--muted);margin-top:1cqw}
.bands.picked .band{opacity:.55}
.bands.picked .band.on{opacity:1}
.band.on i{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.band.on b{font-weight:800}

@media (min-width:500px){
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .wrap{width:412px;height:min(880px,calc(100vh - 32px));min-height:0;overflow-y:auto;overflow-x:hidden;border:10px solid #1b1f27;border-radius:38px;box-shadow:0 12px 40px rgba(15,31,61,.25)}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
